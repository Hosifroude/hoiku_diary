<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ほいくにっき">
<title>ほいくにっき</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf6ec;
    --warm: #f5e6d0;
    --brown: #8b6347;
    --brown-dark: #5c3d2e;
    --accent: #d4845a;
    --green: #7a9e7e;
    --blue: #7a9ab5;
    --purple: #9b89b4;
    --yellow: #c9a84c;
    --text: #3a2a1e;
    --text-light: #8b7355;
    --shadow: 0 4px 20px rgba(139,99,71,0.12);
    --radius: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
  }

  /* HEADER */
  .header {
    background: var(--brown-dark);
    padding: 16px 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-title {
    font-family: 'Noto Serif JP', serif;
    color: var(--cream);
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .header-date {
    color: var(--warm);
    font-size: 12px;
    opacity: 0.8;
  }
  .settings-btn {
    background: none;
    border: none;
    color: var(--cream);
    font-size: 22px;
    cursor: pointer;
    padding: 4px;
  }
  .weather-row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .weather-btn {
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    color: var(--cream);
    font-size: 13px;
    padding: 3px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .weather-btn.selected {
    background: rgba(255,255,255,0.28);
    border-color: rgba(255,255,255,0.6);
    font-weight: 700;
  }

  /* TABS */
  .tabs {
    display: flex;
    background: var(--warm);
    border-bottom: 2px solid rgba(139,99,71,0.15);
    position: sticky;
    top: 0px;
    z-index: 99;
  }
  .tab {
    flex: 1;
    padding: 12px 4px;
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-light);
    cursor: pointer;
    border: none;
    background: none;
    transition: all 0.2s;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
  }
  .tab.active {
    color: var(--brown-dark);
    font-weight: 700;
    border-bottom-color: var(--accent);
    background: var(--cream);
  }

  /* SCREENS */
  .screen { display: none; padding: 16px; }
  .screen.active { display: block; }

  /* EVENT INPUT */
  .category-groups { margin-bottom: 14px; }
  .category-group { margin-bottom: 10px; }
  .category-group-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-light);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 5px;
    padding-left: 2px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .category-group-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(139,99,71,0.15);
  }
  .category-grid {
    display: grid;
    gap: 7px;
  }
  .category-grid.cols4 { grid-template-columns: repeat(4, 1fr); }
  .category-grid.cols3 { grid-template-columns: repeat(3, 1fr); }
  .category-btn {
    padding: 10px 6px;
    border-radius: var(--radius);
    border: 2px solid transparent;
    background: white;
    cursor: pointer;
    text-align: center;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--text);
    box-shadow: var(--shadow);
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .category-btn .icon { font-size: 22px; }
  .category-btn.selected { border-color: var(--accent); background: #fff5ee; }
  .category-btn:disabled,
  .weather-btn:disabled,
  .add-btn:disabled,
  .event-delete:disabled,
  .input-field:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  .category-btn[data-cat="breakfast"].selected { border-color: var(--yellow); background: #fffbf0; }
  .category-btn[data-cat="lunch"].selected { border-color: var(--yellow); background: #fffbf0; }
  .category-btn[data-cat="dinner"].selected { border-color: var(--yellow); background: #fffbf0; }
  .category-btn[data-cat="snack"].selected { border-color: var(--accent); background: #fff5ee; }
  .category-btn[data-cat="wakeup"].selected { border-color: var(--blue); background: #f0f6ff; }
  .category-btn[data-cat="bedtime"].selected { border-color: var(--blue); background: #f0f6ff; }
  .category-btn[data-cat="nap"].selected { border-color: var(--blue); background: #f0f6ff; }
  .category-btn[data-cat="play"].selected { border-color: var(--green); background: #f0fff4; }
  .category-btn[data-cat="poop"].selected { border-color: var(--purple); background: #f8f0ff; }
  .category-btn[data-cat="bath"].selected { border-color: var(--green); background: #f0fff4; }
  .category-btn[data-cat="other"].selected { border-color: #aaa; background: #f5f5f5; }

  .input-group { margin-bottom: 14px; }
  .input-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-light);
    margin-bottom: 6px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .input-field {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid rgba(139,99,71,0.15);
    background: white;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 15px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .input-field:focus { border-color: var(--accent); }
  textarea.input-field {
    resize: none;
    min-height: 80px;
    line-height: 1.6;
  }

  .time-row {
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .time-row .time-group { flex: 1; min-width: 0; }
  .time-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-light);
    margin-bottom: 6px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .time-display {
    width: 100%;
    padding: 11px 10px;
    border-radius: 12px;
    border: 2px solid rgba(139,99,71,0.15);
    background: white;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s;
    box-sizing: border-box;
  }
  .time-display:active { border-color: var(--accent); }
  .time-display.empty { color: var(--text-light); font-weight: 400; font-size: 13px; }
  .time-picker-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    align-items: flex-end;
  }
  .time-picker-overlay.show { display: flex; }
  .time-picker-sheet {
    background: white;
    width: 100%;
    border-radius: 20px 20px 0 0;
    padding: 20px;
  }
  .time-picker-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-light);
    text-align: center;
    margin-bottom: 16px;
  }
  .time-picker-selects {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
    align-items: center;
  }
  .time-select {
    padding: 10px 14px;
    border-radius: 12px;
    border: 2px solid rgba(139,99,71,0.2);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    background: var(--cream);
    text-align: center;
    width: 90px;
    outline: none;
  }
  .time-colon { font-size: 28px; font-weight: 700; color: var(--text); }
  .time-picker-btns { display: flex; gap: 10px; }
  .time-picker-btn {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .time-picker-btn.cancel { background: var(--warm); color: var(--text); }
  .time-picker-btn.now { background: var(--brown); color: white; }
  .time-picker-btn.confirm { background: var(--accent); color: white; }
  .time-picker-quick { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .time-quick-btn {
    padding: 6px 12px;
    border-radius: 20px;
    border: 1.5px solid rgba(139,99,71,0.2);
    background: var(--cream);
    font-size: 12px;
    font-weight: 700;
    color: var(--brown-dark);
    cursor: pointer;
    font-family: 'Zen Kaku Gothic New', sans-serif;
  }

  .add-btn {
    width: 100%;
    padding: 15px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(212,132,90,0.4);
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }
  .add-btn:active { transform: scale(0.98); }
  .add-btn:active:disabled { transform: none; }

  /* EVENT LIST */
  .event-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .event-card {
    background: white;
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    display: flex;
    gap: 12px;
    align-items: flex-start;
    position: relative;
  }
  .event-icon {
    font-size: 28px;
    min-width: 36px;
    text-align: center;
  }
  .event-body { flex: 1; }
  .event-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .event-cat {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: 0.05em;
  }
  .cat-food { background: #fff3cc; color: #8b6a00; }
  .cat-sleep { background: #ddeeff; color: #2a5f8b; }
  .cat-play { background: #ddf5e4; color: #2a6b3e; }
  .cat-health { background: #eeddf5; color: #5a2a6b; }
  .cat-other { background: #eeeeee; color: #555; }
  .event-time { font-size: 12px; color: var(--text-light); }
  .event-memo { font-size: 14px; line-height: 1.6; color: var(--text); }
  .event-delete {
    background: none;
    border: none;
    color: var(--text-light);
    font-size: 18px;
    cursor: pointer;
    padding: 0 0 0 4px;
    opacity: 0.5;
    transition: opacity 0.2s;
  }
  .event-delete:hover { opacity: 1; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-light);
  }
  .empty-state .big { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; line-height: 1.8; }

  /* DIARY */
  .diary-screen { padding: 16px; }
  .api-key-box {
    background: #fff8f0;
    border: 2px dashed var(--accent);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .api-key-box p {
    font-size: 13px;
    color: var(--text-light);
    margin-bottom: 10px;
  }
  .api-key-row { display: flex; gap: 8px; }
  .api-key-input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 2px solid rgba(139,99,71,0.2);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 13px;
    background: white;
    outline: none;
    color: var(--text);
  }
  .api-key-input:focus { border-color: var(--accent); }
  .save-key-btn {
    padding: 10px 16px;
    background: var(--brown-dark);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  .generate-btn {
    width: 100%;
    padding: 16px;
    background: var(--brown-dark);
    color: var(--cream);
    border: none;
    border-radius: var(--radius);
    font-family: 'Noto Serif JP', serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(92,61,46,0.3);
    transition: all 0.2s;
    margin-bottom: 16px;
    letter-spacing: 0.08em;
  }
  .generate-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .generate-btn:active:not(:disabled) { transform: scale(0.98); }

  .day-lock-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding: 10px 12px;
    background: white;
    border-radius: 12px;
    box-shadow: var(--shadow);
  }
  .day-lock-btn {
    flex: 0 0 auto;
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    background: var(--warm);
    color: var(--brown-dark);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .day-lock-btn.locked {
    background: var(--brown-dark);
    color: var(--cream);
  }
  .day-lock-status {
    flex: 1;
    color: var(--text-light);
    font-size: 12px;
    line-height: 1.5;
  }

  .diary-output {
    background: white;
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    min-height: 200px;
    display: none;
  }
  .diary-output.visible { display: block; }
  .diary-output-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--brown-dark);
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--warm);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .copy-btn {
    font-size: 12px;
    padding: 4px 10px;
    background: var(--warm);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: var(--brown-dark);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 700;
  }
  .diary-section-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-light);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .diary-section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(139,99,71,0.15);
  }
  .diary-timeline {
    margin-bottom: 16px;
  }
  .diary-timeline-item {
    display: flex;
    gap: 10px;
    padding: 5px 0;
    font-size: 13px;
    line-height: 1.5;
    border-bottom: 1px dashed rgba(139,99,71,0.1);
  }
  .diary-timeline-item:last-child { border-bottom: none; }
  .diary-timeline-time {
    color: var(--text-light);
    font-size: 12px;
    white-space: nowrap;
    min-width: 50px;
    padding-top: 1px;
  }
  .diary-timeline-event { color: var(--text); flex: 1; }
  .diary-divider {
    border: none;
    border-top: 2px solid var(--warm);
    margin: 14px 0;
  }
  .diary-text {
    font-family: 'Noto Serif JP', serif;
    font-size: 15px;
    line-height: 2;
    color: var(--text);
    white-space: pre-wrap;
  }
  .loading-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 30px;
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* SETTINGS */
  .settings-section {
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 16px;
  }
  .settings-section-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-light);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 12px 16px 8px;
    background: var(--warm);
  }
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-top: 1px solid rgba(139,99,71,0.08);
  }
  .settings-row:first-of-type { border-top: none; }
  .settings-label { font-size: 14px; font-weight: 500; }
  .settings-input {
    padding: 8px 12px;
    border-radius: 10px;
    border: 2px solid rgba(139,99,71,0.2);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 14px;
    background: var(--cream);
    outline: none;
    width: 130px;
    text-align: center;
    color: var(--text);
  }
  .settings-input:focus { border-color: var(--accent); }
  .child-name-input {
    width: 160px;
    text-align: left;
  }

  .sync-indicator {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    margin-left: 8px;
  }
  .sync-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #7fff7f;
  }
  .sync-dot.syncing {
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  .date-picker-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 300;
    align-items: flex-end;
  }
  .date-picker-overlay.show { display: flex; }
  .date-picker-sheet {
    background: white;
    width: 100%;
    border-radius: 20px 20px 0 0;
    padding: 20px;
  }
  .date-picker-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-light);
    text-align: center;
    margin-bottom: 16px;
  }
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .date-nav-btn {
    background: var(--warm);
    border: none;
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 18px;
    cursor: pointer;
    color: var(--brown-dark);
  }
  .date-nav-label {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }
  .date-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 16px;
  }
  .date-grid-header {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-light);
    padding: 4px 0;
  }
  .date-cell {
    text-align: center;
    padding: 8px 4px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    color: var(--text);
    transition: all 0.15s;
  }
  .date-cell:hover { background: var(--warm); }
  .date-cell.today { font-weight: 700; color: var(--accent); }
  .date-cell.selected { background: var(--accent); color: white; border-radius: 50%; }
  .date-cell.empty { cursor: default; }
  .date-cell.future { color: var(--text-light); opacity: 0.4; cursor: default; }
  .date-picker-btns { display: flex; gap: 10px; }
  .date-picker-btn {
    flex: 1;
    padding: 14px;
    border-radius: 14px;
    border: none;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .date-picker-btn.cancel { background: var(--warm); color: var(--text); }
  .date-picker-btn.today-btn { background: var(--brown-dark); color: white; }
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--brown-dark);
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s;
    z-index: 1000;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="header" id="mainHeader">
  <div style="flex:1">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div class="header-title">📒 ほいくにっき</div>
      <button class="settings-btn" onclick="switchTab('settings')">⚙️</button>
    </div>
    <div style="display:flex;align-items:center;gap:6px;">
      <div class="header-date" id="headerDate" onclick="openDatePicker()" style="cursor:pointer;text-decoration:underline dotted rgba(255,255,255,0.5);"></div>
      <span class="sync-indicator" id="syncIndicator" style="display:none">
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncText">同期中</span>
      </span>
    </div>
    <div class="weather-row">
      <button class="weather-btn" data-weather="sunny" onclick="selectWeather(this)">☀️ 晴れ</button>
      <button class="weather-btn" data-weather="cloudy" onclick="selectWeather(this)">☁️ くもり</button>
      <button class="weather-btn" data-weather="rainy" onclick="selectWeather(this)">🌧 雨</button>
      <button class="weather-btn" data-weather="snowy" onclick="selectWeather(this)">❄️ 雪</button>
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('record')" id="tab-record">✏️ 記録</button>
  <button class="tab" onclick="switchTab('list')" id="tab-list">📋 一覧</button>
  <button class="tab" onclick="switchTab('diary')" id="tab-diary">📖 日記</button>
  <button class="tab" onclick="switchTab('settings')" id="tab-settings">⚙️ 設定</button>
</div>

<!-- 記録画面 -->
<div class="screen active" id="screen-record">
  <div class="category-groups">
    <div class="category-group">
      <div class="category-group-label">🍽 食事</div>
      <div class="category-grid cols4">
        <button class="category-btn" data-cat="breakfast" onclick="selectCategory(this)">
          <span class="icon">🌅</span>朝ごはん
        </button>
        <button class="category-btn" data-cat="lunch" onclick="selectCategory(this)">
          <span class="icon">🍜</span>昼ごはん
        </button>
        <button class="category-btn" data-cat="dinner" onclick="selectCategory(this)">
          <span class="icon">🍚</span>夜ごはん
        </button>
        <button class="category-btn" data-cat="snack" onclick="selectCategory(this)">
          <span class="icon">🍪</span>おやつ
        </button>
      </div>
    </div>
    <div class="category-group">
      <div class="category-group-label">😴 睡眠</div>
      <div class="category-grid cols3">
        <button class="category-btn" data-cat="wakeup" onclick="selectCategory(this)">
          <span class="icon">☀️</span>起床
        </button>
        <button class="category-btn" data-cat="nap" onclick="selectCategory(this)">
          <span class="icon">😴</span>昼寝
        </button>
        <button class="category-btn" data-cat="bedtime" onclick="selectCategory(this)">
          <span class="icon">🌙</span>就寝
        </button>
      </div>
    </div>
    <div class="category-group">
      <div class="category-group-label">🌿 生活</div>
      <div class="category-grid cols4">
        <button class="category-btn" data-cat="play" onclick="selectCategory(this)">
          <span class="icon">🎠</span>遊び・活動
        </button>
        <button class="category-btn" data-cat="bath" onclick="selectCategory(this)">
          <span class="icon">🛁</span>お風呂
        </button>
        <button class="category-btn" data-cat="poop" onclick="selectCategory(this)">
          <span class="icon">💩</span>うんち
        </button>
        <button class="category-btn" data-cat="temp" onclick="selectCategory(this)">
          <span class="icon">🌡️</span>体温
        </button>
        <button class="category-btn" data-cat="other" onclick="selectCategory(this)">
          <span class="icon">📌</span>その他
        </button>
      </div>
    </div>
  </div>

  <div class="time-row">
    <div class="time-group">
      <span class="time-label">開始時間</span>
      <div class="time-display empty" id="startTimeDisplay" onclick="openTimePicker('start')">タップして入力</div>
      <input type="hidden" id="startTime">
    </div>
    <div class="time-group">
      <span class="time-label">終了時間（任意）</span>
      <div class="time-display empty" id="endTimeDisplay" onclick="openTimePicker('end')">タップして入力</div>
      <input type="hidden" id="endTime">
    </div>
  </div>

  <!-- 時刻ピッカー -->
  <div class="time-picker-overlay" id="timePickerOverlay" onclick="closeTimePicker(event)">
    <div class="time-picker-sheet">
      <div class="time-picker-title" id="timePickerTitle">開始時間を入力</div>
      <div class="time-picker-quick">
        <button class="time-quick-btn" onclick="setQuickTime(6,0)">6:00</button>
        <button class="time-quick-btn" onclick="setQuickTime(7,0)">7:00</button>
        <button class="time-quick-btn" onclick="setQuickTime(8,0)">8:00</button>
        <button class="time-quick-btn" onclick="setQuickTime(12,0)">12:00</button>
        <button class="time-quick-btn" onclick="setQuickTime(15,0)">15:00</button>
        <button class="time-quick-btn" onclick="setQuickTime(18,0)">18:00</button>
        <button class="time-quick-btn" onclick="setQuickTime(21,0)">21:00</button>
      </div>
      <div class="time-picker-selects">
        <select class="time-select" id="pickerHour"></select>
        <span class="time-colon">:</span>
        <select class="time-select" id="pickerMinute"></select>
      </div>
      <div class="time-picker-btns">
        <button class="time-picker-btn cancel" onclick="closeTimePicker()">キャンセル</button>
        <button class="time-picker-btn now" onclick="setPickerNow()">現在時刻</button>
        <button class="time-picker-btn confirm" onclick="confirmTime()">決定</button>
      </div>
    </div>
  </div>

  <div class="input-group">
    <label class="input-label">メモ</label>
    <textarea class="input-field" id="memoInput" placeholder="例：公園でお砂遊びをしました。楽しそうでした。"></textarea>
  </div>

  <button class="add-btn" onclick="addEvent()" id="addEventBtn">＋ 記録する</button>
</div>

<!-- 一覧画面 -->
<div class="screen" id="screen-list">
  <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
    <button onclick="refreshCurrentDateFromGAS()" style="background:var(--warm);border:none;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--brown-dark);cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;">🔄 最新を取得</button>
  </div>
  <div id="eventList">
    <div class="empty-state">
      <div class="big">📝</div>
      <p>まだ記録がありません。<br>「記録」タブからイベントを追加しましょう。</p>
    </div>
  </div>
</div>

<!-- 日記画面 -->
<div class="screen" id="screen-diary">
  <button class="generate-btn" onclick="generateDiary()" id="generateBtn">
    ✨ 今日の日記を生成する
  </button>

  <div class="day-lock-bar">
    <button class="day-lock-btn" onclick="toggleDayLock()" id="dayLockBtn">🔒 固定する</button>
    <div class="day-lock-status" id="dayLockStatus">固定すると、この日の記録と日記生成を止めます。</div>
  </div>

  <div class="diary-output" id="diaryOutput">
    <div class="diary-output-title">
      <span id="diaryDateLabel"></span>
      <button class="copy-btn" onclick="copyDiary()">コピー</button>
    </div>
    <div class="diary-section-label">📋 タイムライン</div>
    <div class="diary-timeline" id="diaryTimeline"></div>
    <hr class="diary-divider">
    <div class="diary-section-label">📖 日記</div>
    <div class="diary-text" id="diaryText"></div>
  </div>
</div>

<!-- 設定画面 -->
<div class="screen" id="screen-settings">
  <div class="settings-section">
    <div class="settings-section-title">お子さまの情報</div>
    <div class="settings-row">
      <span class="settings-label">お名前</span>
      <input type="text" class="settings-input child-name-input" id="childName" placeholder="例：たろう" oninput="saveSettings()">
    </div>
    <div class="settings-row">
      <span class="settings-label">誕生日</span>
      <input type="date" class="settings-input" id="childBirthday" oninput="saveSettings(); updateAge()">
    </div>
    <div class="settings-row">
      <span class="settings-label">年齢</span>
      <span class="settings-label" id="childAgeDisplay" style="color:var(--brown-dark);font-weight:700;">—</span>
    </div>
  </div>
  <div class="settings-section">
    <div class="settings-section-title">日記の設定</div>
    <div class="settings-row">
      <span class="settings-label">自動生成の時間</span>
      <input type="time" class="settings-input" id="generateTime" value="20:00" oninput="saveSettings()">
    </div>
  </div>
</div>

<div class="date-picker-overlay" id="datePickerOverlay" onclick="closeDatePickerOverlay(event)">
  <div class="date-picker-sheet">
    <div class="date-picker-title">📅 日付を選択</div>
    <div class="date-nav">
      <button class="date-nav-btn" onclick="changeMonth(-1)">‹</button>
      <span class="date-nav-label" id="dateNavLabel"></span>
      <button class="date-nav-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div class="date-grid" id="dateGrid"></div>
    <div class="date-picker-btns">
      <button class="date-picker-btn cancel" onclick="closeDatePicker()">キャンセル</button>
      <button class="date-picker-btn today-btn" onclick="selectToday()">今日</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div id="authGate" style="position:fixed;inset:0;z-index:2000;background:var(--cream);padding:32px 20px;display:none">
  <div style="max-width:390px;margin:10vh auto"><h1 class="header-title" style="background:var(--brown-dark);padding:16px;border-radius:16px">📒 ほいくにっき</h1><p id="authMessage" style="margin:20px 0">ログインしてください。</p>
  <input id="authLogin" class="input-field" autocomplete="username" placeholder="ログインID"><br><br><input id="authPassword" class="input-field" type="password" autocomplete="current-password" placeholder="パスワード（12文字以上）"><br><br>
  <input id="authInvite" class="input-field" type="password" placeholder="家族用招待コード（初回登録時のみ）" style="display:none"><br><br>
  <button class="add-btn" id="authSubmit">ログイン</button><button id="authToggle" style="border:0;background:none;color:var(--brown);width:100%;padding:16px">初回登録はこちら</button></div>
</div>
<script>
(() => {
  const api = async (path, options = {}) => { const r = await fetch('/api/' + path, { credentials:'same-origin', headers:{'content-type':'application/json', ...(options.headers||{})}, ...options }); const data = await r.json().catch(()=>({})); if (!r.ok) throw Object.assign(new Error(data.error || '通信に失敗しました。'), { status:r.status }); return data; };
  let registering = false, events = [], selectedCategory = null, selectedWeather = null, isDayLocked = false, currentDate = new Date(), syncQueue = JSON.parse(localStorage.getItem('hoiku_sync_queue') || '[]');
  const catLabels={breakfast:'朝ごはん',lunch:'昼ごはん',dinner:'夜ごはん',snack:'おやつ',wakeup:'起床',nap:'昼寝',bedtime:'就寝',play:'遊び・活動',bath:'お風呂',poop:'うんち',temp:'体温',other:'その他'}, catIcons={breakfast:'🌅',lunch:'🍜',dinner:'🍚',snack:'🍪',wakeup:'☀️',nap:'😴',bedtime:'🌙',play:'🎠',bath:'🛁',poop:'💩',temp:'🌡️',other:'📌'};
  const toDateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  window.showToast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);};
  window.selectCategory=b=>{if(isDayLocked)return;document.querySelectorAll('.category-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedCategory=b.dataset.cat;};
  const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=String(text);return n;};
  const emptyState=()=>{const box=el('div','empty-state');box.append(el('div','big','📝'),el('p',null,'まだ記録がありません。'));return box;};
  window.renderEvents=()=>{const c=document.getElementById('eventList');c.replaceChildren();if(!events.length){c.append(emptyState());return;}const list=el('div','event-list');events.forEach(e=>{const card=el('div','event-card');card.append(el('span','event-icon',catIcons[e.category]||'📌'));const body=el('div','event-body');body.append(el('b',null,catLabels[e.category]||e.category),el('div',null,`${e.start||''}${e.end?'〜'+e.end:''}`),el('small',null,e.memo||''));card.append(body);if(!isDayLocked){const del=el('button','event-delete','削除');del.dataset.id=e.id;del.onclick=()=>window.deleteEvent(del.dataset.id);card.append(del);}list.append(card);});c.append(list);};
  window.updateLockUI=()=>{const b=document.getElementById('dayLockBtn');b.textContent=isDayLocked?'✏️ 変更する':'🔒 固定する';document.getElementById('dayLockStatus').textContent=isDayLocked?'固定中です。':'固定すると、この日の記録と日記生成を止めます。';document.getElementById('generateBtn').disabled=isDayLocked;};
  window.renderDiaryDisplay=(text,timeline)=>{document.getElementById('diaryOutput').classList.add('visible');document.getElementById('diaryText').textContent=text;const tl=document.getElementById('diaryTimeline');tl.replaceChildren();(timeline||[]).forEach(e=>tl.append(el('div','diary-timeline-item',`${e.start||e.start_time||''}　${catLabels[e.category]||e.category} ${e.memo||''}`)));};
  const persistQueue=()=>localStorage.setItem('hoiku_sync_queue',JSON.stringify(syncQueue));
  window.queueTask=t=>{if(t.password||t.apiKey||t.invite_code)return; if(t.action==='delete')syncQueue=syncQueue.filter(x=>!(x.action==='save'&&x.event?.id===t.id)); if(t.action==='save'&&!syncQueue.some(x=>x.action==='save'&&x.event?.id===t.event?.id))syncQueue.push(t); else if(t.action!=='save'&&!syncQueue.some(x=>JSON.stringify(x)===JSON.stringify(t)))syncQueue.push(t); persistQueue();}; window.removeQueuedTask=t=>{syncQueue=syncQueue.filter(x=>JSON.stringify(x)!==JSON.stringify(t));persistQueue();};
  window.updateDateDisplay=()=>{const label=currentDate.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});document.getElementById('headerDate').textContent='📅 '+label;document.getElementById('diaryDateLabel').textContent=label+'の日記';};

  let timePickerTarget='start', calendarMonth=new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
  window.openTimePicker=target=>{if(isDayLocked)return;timePickerTarget=target;document.getElementById('timePickerTitle').textContent=target==='start'?'開始時間を入力':'終了時間を入力';const nowTime=document.getElementById(target==='start'?'startTime':'endTime').value||'12:00';const [h,m]=nowTime.split(':');document.getElementById('pickerHour').value=h;document.getElementById('pickerMinute').value=m;document.getElementById('timePickerOverlay').classList.add('show');};
  window.setQuickTime=(h,m)=>{document.getElementById('pickerHour').value=String(h).padStart(2,'0');document.getElementById('pickerMinute').value=String(m).padStart(2,'0');};
  window.setPickerNow=()=>{const d=new Date();setQuickTime(d.getHours(),Math.floor(d.getMinutes()/5)*5);};
  window.confirmTime=()=>{const id=timePickerTarget==='start'?'start':'end', value=document.getElementById('pickerHour').value+':'+document.getElementById('pickerMinute').value;document.getElementById(id+'Time').value=value;const display=document.getElementById(id+'TimeDisplay');display.textContent=value;display.classList.remove('empty');closeTimePicker();};
  window.closeTimePicker=e=>{if(!e||e.target.id==='timePickerOverlay'||e.target.classList.contains('cancel'))document.getElementById('timePickerOverlay').classList.remove('show');};
  window.renderCalendar=()=>{const grid=document.getElementById('dateGrid');grid.replaceChildren();document.getElementById('dateNavLabel').textContent=calendarMonth.toLocaleDateString('ja-JP',{year:'numeric',month:'long'});const first=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),1), last=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,0);for(let i=0;i<first.getDay();i++)grid.append(el('div','date-cell empty',''));for(let d=1;d<=last.getDate();d++){const b=el('button','date-cell',d);b.onclick=()=>selectDate(calendarMonth.getFullYear(),calendarMonth.getMonth(),d);grid.append(b);}};
  window.openDatePicker=()=>{calendarMonth=new Date(currentDate.getFullYear(),currentDate.getMonth(),1);renderCalendar();document.getElementById('datePickerOverlay').classList.add('show');};
  window.closeDatePicker=()=>document.getElementById('datePickerOverlay').classList.remove('show'); window.closeDatePickerOverlay=e=>{if(e.target.id==='datePickerOverlay')closeDatePicker();};
  window.changeMonth=d=>{calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+d,1);renderCalendar();};
  window.selectDate=async(y,m,d)=>{currentDate=new Date(y,m,d);updateDateDisplay();closeDatePicker();await refreshCurrentDateFromGAS();}; window.selectToday=()=>selectDate(new Date().getFullYear(),new Date().getMonth(),new Date().getDate());
  for(let h=0;h<24;h++)document.getElementById('pickerHour').append(el('option',null,String(h).padStart(2,'0')));for(let m=0;m<60;m+=5)document.getElementById('pickerMinute').append(el('option',null,String(m).padStart(2,'0')));

  window.switchTab=name=>{document.querySelectorAll('.screen,.tab').forEach(x=>x.classList.remove('active'));document.getElementById('screen-'+name).classList.add('active');document.getElementById('tab-'+name).classList.add('active');};
  window.updateDateDisplay();
  const gate = document.getElementById('authGate'), message = document.getElementById('authMessage');
  function authMode() { document.getElementById('authInvite').style.display = registering ? 'block' : 'none'; document.getElementById('authSubmit').textContent = registering ? '登録する' : 'ログイン'; document.getElementById('authToggle').textContent = registering ? 'ログインへ戻る' : '初回登録はこちら'; message.textContent = registering ? '招待コードを入力して、家族アカウントを登録します。' : 'ログインしてください。'; }
  document.getElementById('authToggle').onclick = () => { registering=!registering; authMode(); };
  document.getElementById('authSubmit').onclick = async () => { try { const payload={login_id:document.getElementById('authLogin').value,password:document.getElementById('authPassword').value}; if(registering) payload.invite_code=document.getElementById('authInvite').value; await api('auth/'+(registering?'register':'login'),{method:'POST',body:JSON.stringify(payload)}); if(registering){registering=false;authMode();showToast('登録しました。ログインしてください。');}else{gate.style.display='none'; await refreshCurrentDateFromGAS(); processQueue();} } catch(e) { message.textContent=e.message; } };
  async function requireLogin(){ try { await api('auth/me'); gate.style.display='none'; } catch { gate.style.display='block'; authMode(); } }
  window.saveSettings = function(){ localStorage.setItem('hoiku_child_name',document.getElementById('childName').value); localStorage.setItem('hoiku_child_birthday',document.getElementById('childBirthday').value); localStorage.setItem('hoiku_generate_time',document.getElementById('generateTime').value); };
  const logout=document.createElement('button');logout.className='add-btn';logout.style.marginTop='16px';logout.textContent='ログアウト';logout.onclick=async()=>{await api('auth/logout',{method:'POST'});gate.style.display='block';};document.getElementById('screen-settings').append(logout);
  window.loadEventsFromGAS = async function(){ const data=await api('day?date='+encodeURIComponent(toDateKey(currentDate))); events=data.events||[]; isDayLocked=!!data.locked; selectedWeather=data.diary?.weather||null; document.querySelectorAll('.weather-btn').forEach(b=>b.classList.toggle('selected',b.dataset.weather===selectedWeather)); renderEvents(); updateLockUI(); if(data.diary?.text) renderDiaryDisplay(data.diary.text,JSON.parse(data.diary.timeline||'[]')); else document.getElementById('diaryOutput').classList.remove('visible'); };
  window.refreshCurrentDateFromGAS = () => loadEventsFromGAS();
  window.saveEventToGAS = async ev => { try { await api('events',{method:'POST',body:JSON.stringify(ev)}); } catch(e) { if(!e.status) queueTask({action:'save',event:ev}); else if(e.status===401) showToast('ログイン後に再送します。'); else if(e.status===423) showToast('固定日のため再送しません。'); throw e; } };
  window.deleteEventFromGAS = async id => { try { await api('events/'+encodeURIComponent(id),{method:'DELETE'}); } catch(e) { if(!e.status) queueTask({action:'delete',id,date:toDateKey(currentDate)}); else if(e.status===401) showToast('ログイン後に再送します。'); else if(e.status===423) showToast('固定日のため再送しません。'); throw e; } };
  window.addEvent = async function(){ if(isDayLocked)return showToast('固定中です。'); if(!selectedCategory)return showToast('カテゴリを選択してください'); const start=document.getElementById('startTime').value; if(!start)return showToast('開始時間を入力してください'); const ev={id:crypto.randomUUID(),date:toDateKey(currentDate),category:selectedCategory,start,end:document.getElementById('endTime').value,memo:document.getElementById('memoInput').value.trim()}; try { await saveEventToGAS(ev); if(!events.some(e=>e.id===ev.id))events.push(ev); renderEvents(); document.getElementById('memoInput').value=''; }catch(e){showToast(e.message);} };
  window.deleteEvent = async function(id){ if(isDayLocked)return showToast('固定中です。'); try{await deleteEventFromGAS(id);events=events.filter(e=>e.id!==id);renderEvents();}catch(e){showToast(e.message);} };
  window.selectWeather = async function(btn){ if(isDayLocked)return showToast('固定中です。'); try { selectedWeather=btn.dataset.weather; await api('weather',{method:'PUT',body:JSON.stringify({date:toDateKey(currentDate),weather:selectedWeather})}); document.querySelectorAll('.weather-btn').forEach(b=>b.classList.toggle('selected',b===btn)); }catch(e){showToast(e.message);} };
  window.toggleDayLock = async function(){ try { await api('locks',{method:'PUT',body:JSON.stringify({date:toDateKey(currentDate),locked:!isDayLocked})}); isDayLocked=!isDayLocked;updateLockUI(); }catch(e){showToast(e.message);} };
  window.generateDiary = async function(){ if(isDayLocked)return showToast('固定中です。'); const btn=document.getElementById('generateBtn');btn.disabled=true;try{const d=await api('diaries/generate',{method:'POST',body:JSON.stringify({date:toDateKey(currentDate),child_name:document.getElementById('childName').value,age:document.getElementById('childAgeDisplay').textContent})});renderDiaryDisplay(d.text,d.timeline); }catch(e){showToast(e.message);}finally{btn.disabled=false;} };
  window.processQueue = async function(){ if(!navigator.onLine)return; const queued=[...syncQueue]; for(const task of queued){try{if(task.action==='save')await api('events',{method:'POST',body:JSON.stringify(task.event)});else if(task.action==='delete')await api('events/'+encodeURIComponent(task.id),{method:'DELETE'});removeQueuedTask(task);}catch(e){if(e.status===401){showToast('再ログイン後に再送します。');break;} if([400,403,409,423].includes(e.status)){removeQueuedTask(task); if(e.status===423)showToast('固定日の操作は再送しません。'); continue;} break;}} };
  requireLogin();
})();
</script>
</body>
</html>
